name: Shadow fund

on:
  schedule:
    # 22:30 UTC on weekdays, after the US close in both summer and winter.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: today runs one session. replay walks a date range without refreshing market data.
        type: choice
        options:
          - today
          - replay
        default: today
      as_of:
        description: Session date when mode is today. Use today or YYYY-MM-DD.
        type: string
        default: today
      replay_start:
        description: First day of a replay (YYYY-MM-DD).
        type: string
        required: false
      replay_end:
        description: Last day of a replay (YYYY-MM-DD).
        type: string
        required: false

concurrency:
  group: shadow-fund
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: monterey-fund
      R2_PREFIX: halalquant
      HALALQUANT_DATA_DIR: /tmp/halalquant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "halalquant[cache] @ git+https://github.com/regional-specter/halalquant.git@v0.3.0"

      - name: Download market cache
        run: |
          mkdir -p "$HALALQUANT_DATA_DIR"
          aws s3 sync "s3://${R2_BUCKET}/${R2_PREFIX}/" "$HALALQUANT_DATA_DIR/" \
            --endpoint-url "$R2_ENDPOINT"
          test -f "$HALALQUANT_DATA_DIR/cache.duckdb"

      - name: Run session
        id: session
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'today' }}
          AS_OF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.as_of || 'today' }}
          REPLAY_START: ${{ github.event.inputs.replay_start }}
          REPLAY_END: ${{ github.event.inputs.replay_end }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            set +e
            python - <<'PY'
          import sys
          from datetime import date, timedelta

          import pandas as pd

          frame = pd.read_csv("ops/state/nav.csv")
          if frame.empty or "as_of" not in frame.columns:
              print("Scheduled run skipped. NAV has no sessions yet.")
              sys.exit(2)
          last = pd.Timestamp(frame["as_of"].iloc[-1]).date()
          if last < date.today() - timedelta(days=5):
              print(f"Scheduled run skipped. Last NAV is {last}, still inside the history replay.")
              sys.exit(2)
          PY
            status=$?
            set -e
            if [ "$status" -eq 2 ]; then
              exit 0
            fi
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          fi
          if [ ! -f ops/state/nav.csv ] || [ ! -f ops/state/account.json ]; then
            echo "ops/state/nav.csv and account.json must already be in the repo."
            echo "Otherwise this job would open a new paper account."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import date, timedelta

          import pandas as pd

          BUDGET_S = 3 * 60 * 60
          SAVE_EVERY = 21

          def last_nav():
              frame = pd.read_csv("ops/state/nav.csv")
              if frame.empty or "as_of" not in frame.columns:
                  return None
              return pd.Timestamp(frame["as_of"].iloc[-1]).date()

          def run_day(day, refresh):
              print(f"=== {day.isoformat()} ===", flush=True)
              command = [sys.executable, "-m", "ops", "schedule", "--as-of", day.isoformat()]
              if not refresh:
                  command.append("--skip-refresh")
              result = subprocess.run(command, check=False)
              if result.returncode != 0:
                  sys.exit(result.returncode)

          def checkpoint(label):
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(
                  ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(["git", "add", "-f", "ops/state", "ops/runs"], check=True)
              subprocess.run(["git", "reset", "--", "ops/state/.gitignore"], check=True)
              if subprocess.run(["git", "diff", "--staged", "--quiet"]).returncode == 0:
                  print("No ledger changes.", flush=True)
                  return
              subprocess.run(["git", "commit", "-m", f"Mark paper NAV through {label}"], check=True)
              ref = os.environ["GITHUB_REF_NAME"]
              subprocess.run(["git", "pull", "--rebase", "origin", ref], check=True)
              subprocess.run(["git", "push", "origin", f"HEAD:{ref}"], check=True)
              print(f"Saved ledger through {label}.", flush=True)

          def write_outputs(continue_replay, replay_end):
              path = os.environ.get("GITHUB_OUTPUT")
              if not path:
                  return
              with open(path, "a", encoding="utf-8") as handle:
                  handle.write(f"continue={continue_replay}\n")
                  handle.write(f"replay_end={replay_end}\n")

          mode = os.environ.get("MODE") or "today"
          if mode != "replay":
              requested = os.environ.get("AS_OF") or "today"
              if requested == "today":
                  previous = last_nav()
                  start = previous + timedelta(days=1) if previous else date.today()
                  end = date.today()
                  if (end - start).days > 10:
                      sys.exit(f"Refusing to catch up {start} through {end} from the nightly job.")
              else:
                  start = end = date.fromisoformat(requested)
              day = start
              while day <= end:
                  run_day(day, refresh=True)
                  day += timedelta(days=1)
              write_outputs("false", "")
              raise SystemExit(0)

          end_text = os.environ.get("REPLAY_END") or ""
          if not end_text:
              sys.exit("replay needs replay_end")
          end = date.fromisoformat(end_text)
          previous = last_nav()
          if previous is not None:
              start = previous + timedelta(days=1)
          else:
              start = date.fromisoformat(os.environ.get("REPLAY_START") or "2020-01-02")
          if start > end:
              print(f"Replay already complete through {previous}.", flush=True)
              write_outputs("false", end.isoformat())
              raise SystemExit(0)

          from ops.replay import replay_range

          result = replay_range(
              start,
              end,
              budget_s=BUDGET_S,
              save_every=SAVE_EVERY,
              on_checkpoint=checkpoint,
          )
          print(json.dumps(result.as_dict()), flush=True)
          write_outputs("true" if not result.complete else "false", end.isoformat())
          PY

      - name: Upload market cache
        if: success()
        run: |
          aws s3 sync "$HALALQUANT_DATA_DIR/" "s3://${R2_BUCKET}/${R2_PREFIX}/" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Commit ledger
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/state ops/runs
          git reset -- ops/state/.gitignore
          if git diff --staged --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "Mark paper NAV"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Continue replay
        if: success() && steps.session.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run main.yml --ref "${GITHUB_REF_NAME}" \
            -f mode=replay \
            -f replay_end="${{ steps.session.outputs.replay_end }}"
