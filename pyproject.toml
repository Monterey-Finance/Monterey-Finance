[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monterey"
version = "0.2.0"
description = "Monterey Finance fund core: book specs, layers, one simulator, ledgers, diagnostics, research data."
requires-python = ">=3.11"
dependencies = [
    "halalquant[cache] @ git+https://github.com/regional-specter/halalquant.git@v0.4.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
desk = ["textual>=0.60", "rich>=13"]
research = ["matplotlib>=3.8", "ipython>=8"]
dev = ["pytest>=8", "textual>=0.60", "rich>=13"]

[tool.setuptools.packages.find]
include = ["monterey*", "ops*", "desk*"]
exclude = ["ops.runs*", "ops.state*"]
