name: Shadow fund

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: today runs one session. replay walks a date range without refreshing market data.
        type: choice
        options:
          - today
          - replay
        default: today
      as_of:
        description: Session date when mode is today. Use today or YYYY-MM-DD.
        type: string
        default: today
      replay_start:
        description: First day of a replay (YYYY-MM-DD).
        type: string
        required: false
      replay_end:
        description: Last day of a replay (YYYY-MM-DD).
        type: string
        required: false

concurrency:
  group: shadow-fund
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: monterey-fund
      R2_PREFIX: halalquant
      HALALQUANT_DATA_DIR: /tmp/halalquant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download market cache
        run: |
          mkdir -p "$HALALQUANT_DATA_DIR"
          aws s3 sync "s3://${R2_BUCKET}/${R2_PREFIX}/" "$HALALQUANT_DATA_DIR/" \
            --endpoint-url "$R2_ENDPOINT"
          test -f "$HALALQUANT_DATA_DIR/cache.duckdb"

      - name: Download ledgers
        run: |
          mkdir -p ledgers
          aws s3 sync "s3://${R2_BUCKET}/ledgers/" ledgers/ --endpoint-url "$R2_ENDPOINT" || true

      - name: Run session
        id: session
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'today' }}
          AS_OF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.as_of || 'today' }}
          REPLAY_START: ${{ github.event.inputs.replay_start }}
          REPLAY_END: ${{ github.event.inputs.replay_end }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import date

          from ops.data import resolve_as_of
          from ops.fund import replay_book, run_live_session

          mode = os.environ.get("MODE") or "today"
          if mode == "replay":
              end_text = os.environ.get("REPLAY_END") or ""
              if not end_text:
                  sys.exit("replay needs replay_end")
              start = date.fromisoformat(os.environ.get("REPLAY_START") or "2020-01-02")
              end = date.fromisoformat(end_text)
              ledger = replay_book(start, end, refresh=False, progress=True)
          else:
              as_of = resolve_as_of(os.environ.get("AS_OF") or "today")
              ledger = replay_book(date(2020, 1, 2), as_of, refresh=True, progress=True)
              print(json.dumps(run_live_session(as_of, refresh=False), default=str), flush=True)
          print(json.dumps({
              "path": str(ledger.path),
              "sessions": int(len(ledger.nav)),
              "hash": ledger.spec.hash(),
              "last_nav": None if ledger.nav.empty else float(ledger.nav["nav"].iloc[-1]),
          }, default=str), flush=True)
          PY

      - name: Upload market cache
        if: success()
        run: |
          aws s3 sync "$HALALQUANT_DATA_DIR/" "s3://${R2_BUCKET}/${R2_PREFIX}/" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Upload ledgers to R2
        if: success()
        run: |
          if [ -d ledgers ]; then
            aws s3 sync ledgers/ "s3://${R2_BUCKET}/ledgers/" --endpoint-url "$R2_ENDPOINT"
          fi

      - name: Commit spec, NAV, and diagnostics
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books ops/state/nav.csv ops/state/account.json 2>/dev/null || true
          find ledgers \( -name spec.yaml -o -name manifest.json -o -name nav.parquet -o -name diagnostics.json \) \
            | xargs -r git add -f
          if git diff --staged --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "Mark paper NAV"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
