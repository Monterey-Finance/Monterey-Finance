name: Shadow fund

on:
  schedule:
    # 22:30 UTC on weekdays, after the US close in both summer and winter.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: today runs one session. replay walks a date range without refreshing market data.
        type: choice
        options:
          - today
          - replay
        default: today
      as_of:
        description: Session date when mode is today. Use today or YYYY-MM-DD.
        type: string
        default: today
      replay_start:
        description: First day of a replay (YYYY-MM-DD).
        type: string
        required: false
      replay_end:
        description: Last day of a replay (YYYY-MM-DD).
        type: string
        required: false

concurrency:
  group: shadow-fund
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: monterey-fund
      R2_PREFIX: halalquant
      HALALQUANT_DATA_DIR: /tmp/halalquant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "halalquant[cache] @ git+https://github.com/regional-specter/halalquant.git@v0.3.0"

      - name: Download market cache
        run: |
          mkdir -p "$HALALQUANT_DATA_DIR"
          aws s3 sync "s3://${R2_BUCKET}/${R2_PREFIX}/" "$HALALQUANT_DATA_DIR/" \
            --endpoint-url "$R2_ENDPOINT"
          test -f "$HALALQUANT_DATA_DIR/cache.duckdb"

      - name: Run session
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'today' }}
          AS_OF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.as_of || 'today' }}
          REPLAY_START: ${{ github.event.inputs.replay_start }}
          REPLAY_END: ${{ github.event.inputs.replay_end }}
        run: |
          set -euo pipefail
          if [ ! -f ops/state/nav.csv ] || [ ! -f ops/state/account.json ]; then
            echo "ops/state/nav.csv and account.json must already be in the repo."
            echo "Otherwise this job would open a new paper account."
            exit 1
          fi
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import date, timedelta

          mode = os.environ.get("MODE") or "today"
          if mode != "replay":
              as_of = os.environ.get("AS_OF") or "today"
              raise SystemExit(subprocess.call([sys.executable, "-m", "ops", "schedule", "--as-of", as_of]))

          start_text = os.environ.get("REPLAY_START") or ""
          end_text = os.environ.get("REPLAY_END") or ""
          if not start_text or not end_text:
              sys.exit("replay needs replay_start and replay_end")
          start = date.fromisoformat(start_text)
          end = date.fromisoformat(end_text)
          if end < start:
              sys.exit("replay_end is before replay_start")
          day = start
          while day <= end:
              print(f"=== {day.isoformat()} ===", flush=True)
              result = subprocess.run(
                  [sys.executable, "-m", "ops", "schedule", "--as-of", day.isoformat(), "--skip-refresh"],
                  check=False,
              )
              if result.returncode != 0:
                  sys.exit(result.returncode)
              day += timedelta(days=1)
          PY

      - name: Upload market cache
        if: success()
        run: |
          aws s3 sync "$HALALQUANT_DATA_DIR/" "s3://${R2_BUCKET}/${R2_PREFIX}/" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Commit ledger
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/state ops/runs
          git reset -- ops/state/.gitignore
          if git diff --staged --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "Mark paper NAV"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
